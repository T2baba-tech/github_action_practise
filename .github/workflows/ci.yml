name: Python CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    outputs:
      message: ${{ steps.message.outputs.text }}
    env:
      APP_ENV: ci

    steps:
      - name: check out repository code
        uses: actions/checkout@v4

      - name: inspect checkout repository
        run: |
          echo "working directory: $PWD"
          ls -alh

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: show runner info
        run: |
          echo "Operating System: $RUNNER_OS"
          uname -a

      - name: show app environment
        run: |
          echo "APP_ENV: $APP_ENV"

      - name: Show Python version
        run: python --version

      - name: check demo secret availability
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          if [ -n "$DEMO_TOKEN" ]; then
            echo "DEMO_TOKEN IS CONFIGURED"
          else
            echo "DEMO_TOKEN IS NOT CONFIGURED"
          fi

      - name: inspect workflow context
        env:
          ACTION_EVENTS: ${{ toJSON(github.event) }}
          ACTION_REF: ${{ github.ref }}
          ACTION_APP_ENV: ${{ env.APP_ENV }}
          ACTION_REPOSITORY: ${{ github.repository }}
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          echo "Event: $ACTION_EVENTS"
          echo "Ref: $ACTION_REF"
          echo "APP_ENV: $ACTION_APP_ENV"
          echo "Repository: $ACTION_REPOSITORY"
          if [ -n "$DEMO_TOKEN" ]; then
            echo "DEMO_TOKEN IS CONFIGURED"
          else
            echo "DEMO_TOKEN IS NOT CONFIGURED"
          fi

      - name: Create a message
        id: message
        run: echo "text=Hello from previous steps!" >> "$GITHUB_OUTPUT"

      - name: read the message
        env:
          MESSAGE: ${{ steps.message.outputs.text }}
        run: echo "$MESSAGE"

      - name: run application
        run: python app.py

      - name: run automated tests
        env:
          APP_ENV: test
        run: |
          echo "APP_ENV=$APP_ENV"
          python -m unittest discover

  runner-info:
    runs-on: ubuntu-24.04
    needs: build-and-test
    steps:
      - name: Receive message from build-and-test
        env:
          MESSAGE: ${{ needs.build-and-test.outputs.message }}
        run: |
          echo "Received: $MESSAGE"

      - name: Show this job's ID
        run: |
          echo "Current job: $GITHUB_JOB"

      - name: Show operating system
        run: |
          echo "operating system: $RUNNER_OS"
